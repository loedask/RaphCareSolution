<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RaphCare</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="RaphCare.Portal.styles.css" rel="stylesheet" /> -->
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        <span data-i18n="error">An unhandled error has occurred.</span>
        <a href="." class="reload" data-i18n="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
    <script src="_content/RaphCare.Ui/js/searchable-select.js"></script>
    <script src="js/locale.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/clinic.js"></script>
    <script src="js/onboarding.js"></script>
    <script src="js/telehealth.js"></script>
    <script>
      (function () {
        var messages = {
          en: { error: "An unhandled error has occurred.", reload: "Reload" },
          fr: { error: "Une erreur non gérée s'est produite.", reload: "Recharger" },
          ln: { error: "Libunga oyo ezalaki te ekomi.", reload: "Kangola lisusu" },
          sw: { error: "Hitilafu isiyoshughulikiwa imetokea.", reload: "Pakia tena" }
        };
        var code = (localStorage.getItem("web_language") || "en").toLowerCase();
        if (!messages[code]) code = "en";
        document.documentElement.lang = code;
        var m = messages[code];
        var err = document.querySelector("#blazor-error-ui [data-i18n=error]");
        var reload = document.querySelector("#blazor-error-ui [data-i18n=reload]");
        if (err) err.textContent = m.error;
        if (reload) reload.textContent = m.reload;
      })();
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
