# Docs: https://github.com/Azure/webapps-deploy
# Deploys RaphCare.API to Azure App Service raphcare-api on push to develop.

name: Build and deploy API - raphcare-api

on:
  push:
    branches:
      - develop
    paths:
      - 'RaphCare.API/**'
      - 'RaphCare.Application/**'
      - 'RaphCare.Domain/**'
      - 'RaphCare.Identity/**'
      - 'RaphCare.Infrastructure/**'
      - 'RaphCare.Persistence/**'
      - 'Directory.Build.props'
      - '.github/workflows/develop_raphcare-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-raphcare-api
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish API
        run: >
          dotnet publish RaphCare.API/RaphCare.API.csproj
          -c Release
          -o ./publish-api

      - name: Zip publish output
        run: (cd ./publish-api && zip -r ../raphcare-api.zip .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: raphcare-api
          path: raphcare-api.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: raphcare-api
          path: ./artifact

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_RAPHCAREAPI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: raphcare-api
          resource-group-name: raphcare_group
          package: ./artifact/raphcare-api.zip
