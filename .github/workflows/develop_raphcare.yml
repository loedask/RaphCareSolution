# Docs: https://github.com/Azure/webapps-deploy
# Deploys RaphCare.Web (Blazor WASM) -> Azure App Service "raphcare"

name: Build and deploy Web - raphcare

on:
  push:
    branches:
      - develop
    paths:
      - 'RaphCare.Web/**'
      - 'RaphCare.Client/**'
      - 'RaphCare.Domain/**'
      - 'Directory.Build.props'
      - '.github/workflows/develop_raphcare.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Point Web at hosted API
        shell: bash
        run: |
          api_base="${{ vars.RAPHCARE_API_BASE_URL }}"
          if [ -z "$api_base" ]; then
            api_base="https://raphcare-api-eydjcnefhae2dpa2.southafricanorth-01.azurewebsites.net"
          fi
          api_base="${api_base%/}"
          printf '%s\n' "{ \"ApiBaseUrl\": \"$api_base\" }" > RaphCare.Web/wwwroot/appsettings.json
          cat RaphCare.Web/wwwroot/appsettings.json

      - name: Publish Web
        run: dotnet publish RaphCare.Web/RaphCare.Web.csproj -c Release -o ./publish-web

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: raphcare-web
          path: ./publish-web/wwwroot

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: raphcare-web

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_RAPHCARE }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'raphcare'
          slot-name: 'Production'
          package: .
